  # calendar and contact. Every key in the file is declared below (notes for
  # the IT team as hidden fields), so saving from the CMS never drops data.
  # scripts/check-site.mjs runs before every build and stops a deploy if a
  # save ever leaves a required value missing; the live site then stays on the
  # last good version.
